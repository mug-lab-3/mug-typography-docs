<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      let waitingWorker;
      let reloadForUpdate = false;
      const observedWorkers = new WeakSet();
      const updateNotice = document.getElementById('app-update-notice');
      const updateButton = document.getElementById('app-update-button');
      const showUpdate = (worker) => {
        waitingWorker = worker;
        updateNotice.hidden = false;
      };

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadForUpdate) {
          window.location.reload();
        }
      });
      updateButton.addEventListener('click', () => {
        if (waitingWorker) {
          reloadForUpdate = true;
          waitingWorker.postMessage({ type: 'SKIP_WAITING' });
        }
      });

      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((registration) => {
        const observeInstallingWorker = (worker) => {
          if (observedWorkers.has(worker)) {
            return;
          }
          observedWorkers.add(worker);
          worker.addEventListener('statechange', () => {
            if (worker.state !== 'installed') {
              return;
            }
            if (navigator.serviceWorker.controller) {
              showUpdate(worker);
            } else {
              worker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        };

        if (registration.waiting) {
          showUpdate(registration.waiting);
        }
        if (registration.installing) {
          observeInstallingWorker(registration.installing);
        }
        registration.addEventListener('updatefound', () => {
          if (registration.installing) {
            observeInstallingWorker(registration.installing);
          }
        });
      }).catch((error) => {
        console.warn('Service Worker registration failed:', error);
      });
    });
  }
</script>

<aside
  id="app-update-notice"
  class="app-update-notice"

  aria-live="polite"
  aria-labelledby="app-update-title"
  aria-describedby="app-update-message"
  hidden

      <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"></path>

    <span id="app-update-message" data-i18n="update.message">Reload the online simulator to switch to its latest version.</span>
  </span>
  <button id="app-update-button" class="app-update-button" type="button">
    <span id="app-update-button-label" data-i18n="update.reload">Update simulator</span>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
      <path d="m6 3 5 5-5 5"></path>
    </svg>
  </button>
</aside>

  <div class="app-bar">

      id="app-menu-button"
      class="app-bar-menu-button"
      type="button"
      aria-haspopup="true"
      aria-expanded="false"
      aria-label="Menu"
      data-i18n-aria-label="menu.label"
